    <!-- ─── Inline Critical CSS for instant background ──── -->
    <style>
      html, body, #root { margin: 0; padding: 0; background: #04070f; }
      body { overflow: hidden; }

      /* ── Boot splash ─────────────────────────────────── */
      #boot {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background:
          radial-gradient(60% 50% at 20% 10%, rgba(34,211,238,0.18), transparent 65%),
          radial-gradient(55% 45% at 85% 20%, rgba(59,130,246,0.20), transparent 65%),
          radial-gradient(60% 50% at 60% 100%, rgba(16,185,129,0.16), transparent 65%),
          #04070f;
        transition: opacity .55s ease, visibility .55s ease;
      }
      #boot.done { opacity: 0; visibility: hidden; }
      .boot-mark {
        position: relative; width: 84px; height: 84px; border-radius: 26px; overflow: hidden;
        box-shadow: 0 24px 60px -18px rgba(34,211,238,0.65), 0 0 0 1px rgba(255,255,255,0.12);
        animation: bootFloat 3.4s ease-in-out infinite;
      }
      .boot-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .boot-ring {
        position: absolute; inset: -26px; border-radius: 50%;
        border: 1px solid rgba(125,211,252,0.28);
        animation: bootPulse 2.6s ease-out infinite;
      }
      .boot-ring.r2 { inset: -48px; animation-delay: .7s; border-color: rgba(16,185,129,0.22); }
      .boot-name {
        font-family: 'Sora', 'Inter', sans-serif; font-size: 13px; font-weight: 800;
        letter-spacing: .42em; color: #eaf6ff; text-transform: uppercase;
        text-indent: .42em;
      }
      .boot-sub {
        font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: .28em; color: rgba(125,211,252,.6); text-transform: uppercase;
        margin-top: -14px;
      }
      .boot-bar {
        width: 168px; height: 2px; border-radius: 99px; overflow: hidden;
        background: rgba(255,255,255,0.08); margin-top: 6px;
      }
      .boot-bar i {
        display: block; height: 100%; width: 45%; border-radius: 99px;
        background: linear-gradient(90deg, #22d3ee, #2563eb, #10b981);
        animation: bootSlide 1.25s cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      @keyframes bootPulse { 0% { transform: scale(.85); opacity: .85; } 100% { transform: scale(1.25); opacity: 0; } }
      @keyframes bootFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      /* Boot splash handles FOUC (see #boot) */
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-mark">
        <span class="boot-ring"></span>
        <span class="boot-ring r2"></span>
        <img src="/brand/app-icon.jpg" alt="Kekulawala" />
      </div>
      <div class="boot-name">Kekulawala</div>
      <div class="boot-sub">Aurora Command · ERP v6</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>

    <!-- ─── Build guard · stale-cache recovery · boot watchdog ─── -->
    <script>
      window.__KERP_BUILD__ = '6.2.0';
      (function () {
        var BUILD = '6.2.0';
        var BUILD_KEY = 'kerp_build';
        var RESET_KEY = 'kerp_reset_done_' + BUILD;
        var params = new URLSearchParams(location.search);

        /* ── Safe mode (also honoured in main.jsx) ─────────── */
        if (params.has('safe')) document.documentElement.classList.add('safe-mode');

        /* ── Hard reset helper (used by the watchdog + boundary) ── */
        window.__KERP_HARD_RESET__ = function () {
          try { localStorage.setItem(BUILD_KEY, BUILD); } catch (e) {}
          try { sessionStorage.setItem(RESET_KEY, '1'); } catch (e) {}
          var finish = function () {
            var url = new URL(location.href);
            url.searchParams.set('v', Date.now().toString(36));
            url.searchParams.delete('reset');
            location.replace(url.toString());
          };
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) {}
          try {
            if (window.caches) {
              jobs.push(window.caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
              }));
            }
          } catch (e) {}
          if (!jobs.length) return finish();
          Promise.all(jobs).then(finish).catch(finish);
          setTimeout(finish, 1200);
        };

        /* ── Stale-build guard ──────────────────────────────
           If the stored build differs, drop every service worker
           and cache once, then reload onto a clean origin state. */
        var stored = null, alreadyReset = false;
        try { stored = localStorage.getItem(BUILD_KEY); } catch (e) {}
        try { alreadyReset = !!sessionStorage.getItem(RESET_KEY); } catch (e) {}
        var forced = params.has('reset');

        function resetOnce() {
          if (alreadyReset) return;
          alreadyReset = true;
          try { sessionStorage.setItem(RESET_KEY, '1'); localStorage.setItem(BUILD_KEY, BUILD); } catch (e) {}
          window.__KERP_HARD_RESET__();
        }

        if (forced) {
          resetOnce();
        } else if (stored && stored !== BUILD) {
          // A different build was cached — purge before booting.
          resetOnce();
        } else {
          try { localStorage.setItem(BUILD_KEY, BUILD); } catch (e) {}
          // First run of this guard: if a service worker from an older
          // release is still registered it can shadow fresh modules.
          // Detect it once and self-heal.
          if (!stored && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration()
              .then(function (reg) { if (reg) resetOnce(); })
              .catch(function () {});
          }
        }

        /* ── Failure panel ─────────────────────────────────── */
        function fatal(title, detail) {
          var boot = document.getElementById('boot');
          var host = boot || document.body.appendChild(document.createElement('div'));
          host.className = '';
          host.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
            'justify-content:center;padding:24px;background:#04070f;font-family:Inter,system-ui,sans-serif;';
          host.innerHTML =
            '<div style="width:min(620px,100%);padding:26px 28px;border-radius:22px;' +
              'border:1px solid rgba(255,255,255,0.12);background:#0b1322;color:#eaf2ff;' +
              'box-shadow:0 40px 100px -40px rgba(0,0,0,0.9)">' +
              '<div style="font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;' +
                'color:#fda4af;margin-bottom:6px">Kekulawala ERP · Recovery</div>' +
              '<div style="font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px">' + title + '</div>' +
              '<div style="font-size:13px;line-height:1.6;color:rgba(226,240,255,.72);margin-bottom:14px">' + detail + '</div>' +
              '<pre id="kg-detail" style="display:none;margin:0 0 16px;padding:12px 14px;border-radius:12px;' +
                'background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.22);color:#fecdd3;' +
                'font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:180px;' +
                'overflow:auto"></pre>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
                '<button onclick="window.__KERP_HARD_RESET__()" style="padding:11px 20px;border-radius:12px;' +
                  'border:1px solid rgba(255,255,255,.16);cursor:pointer;color:#fff;font-size:13px;font-weight:700;' +
                  'background:linear-gradient(120deg,#22d3ee,#2563eb 55%,#0ea371)">Reset cache &amp; reload</button>' +
                '<button onclick="location.reload()" style="padding:11px 18px;border-radius:12px;cursor:pointer;' +
                  'border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dbe7f8;' +
                  'font-size:13px;font-weight:650">Reload</button>' +
                '<a href="?safe=1" style="padding:11px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.14);' +
                  'color:rgba(226,240,255,.7);font-size:13px;font-weight:650;text-decoration:none">Safe mode</a>' +
              '</div></div>';
          if (detail) {
            var pre = document.getElementById('kg-detail');
            if (pre && window.__KERP_LAST_ERROR__) { pre.style.display = 'block'; pre.textContent = window.__KERP_LAST_ERROR__; }
          }
        }
        window.__KERP_FATAL__ = fatal;

        /* Capture early script/module errors */
        window.addEventListener('error', function (ev) {
          var msg = ev && (ev.message || (ev.error && ev.error.message));
          if (!msg) return;
          // Ignore benign Firestore/offline noise
          if (/firestore|firebase|ResizeObserver|Script error/i.test(msg)) return;
          window.__KERP_LAST_ERROR__ = msg + (ev.filename ? '\n' + ev.filename + ':' + ev.lineno : '');
          if (!window.__KERP_BOOTED__) fatal('The workspace could not start', 'A script failed to load. This is usually a stale cached build — resetting the cache resolves it.');
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          var msg = r && (r.message || String(r));
          if (!msg || /firestore|firebase|offline|network/i.test(msg)) return;
          window.__KERP_LAST_ERROR__ = msg;
        });

        /* Watchdog: if React never mounts, surface the problem */
        setTimeout(function () {
          if (window.__KERP_BOOTED__) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var err = window.__KERP_BOOT_ERROR__ || window.__KERP_LAST_ERROR__;
          if (err) window.__KERP_LAST_ERROR__ = (err.stack || err.message || String(err));
          fatal('Taking longer than expected',
                'The interface did not finish loading. Reset the cache to pull a fresh build — your data in Firebase is untouched.');
        }, 9000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      /* Service-worker registration now lives in src/main.jsx and is
         production-only, so dev / preview never serves stale modules. */

      // Prevent double-tap zoom on iOS (ERP UX improvement)
      document.addEventListener('touchend', function (event) {
        // Only suppress rapid double-tap zoom on non-interactive targets,
        // never on buttons/links/inputs (that would eat real clicks).
        var t = event.target;
        if (t && t.closest && t.closest('button, a, input, select, textarea, [role="button"], .nav-item, .filter-chip')) return;
        var now = Date.now();
        if (now - this.lastTouch <= 300) event.preventDefault();
        this.lastTouch = now;
      }, { passive: false });
    </script>
